<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">60 / 30 / 10 is probability</title><desc id="desc">A useful starting point for three kick variations — not a repeating sequence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a0aaba"/></marker></defs><rect width="960" height="340" rx="16" fill="#11151b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf1f6"><text x="28" y="38" font-size="24" font-weight="700">60 / 30 / 10 is probability</text><text x="28" y="65" font-size="15" fill="#a7b1c0">A useful starting point for three kick variations — not a repeating sequence.</text><rect x="28" y="108" width="542" height="64" rx="8" fill="#c84358"/><rect x="570" y="108" width="271" height="64" fill="#ac752e"/><rect x="841" y="108" width="91" height="64" rx="8" fill="#3978a4"/><text x="46" y="148" font-size="23" font-weight="700">Kick A · 60%</text><text x="588" y="148" font-size="23" font-weight="700">Kick B · 30%</text><text x="852" y="148" font-size="22">10%</text><text x="28" y="222" font-size="19">Each Master trigger draws again. A → A → B → A → C is possible.</text><text x="28" y="254" font-size="18" fill="#bec8d6">Repetitions are allowed; ten triggers do not guarantee six A, three B and one C.</text><text x="28" y="284" font-size="18" fill="#bec8d6">A weight of zero keeps membership but excludes that slice from the draw.</text><text x="28" y="322" font-size="13" fill="#9aa6b6">Tracker CE Modular · diagram, not a device screenshot</text></g></svg>