<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Create, add, balance, play</title><desc id="desc">Sample Playback → Beat Slice → MORE page 3</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a0aaba"/></marker></defs><rect width="960" height="340" rx="16" fill="#11151b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf1f6"><text x="28" y="38" font-size="24" font-weight="700">Create, add, balance, play</text><text x="28" y="65" font-size="15" fill="#a7b1c0">Sample Playback → Beat Slice → MORE page 3</text><rect x="28" y="112" width="200" height="118" rx="10" fill="#2b3542" stroke="#586476"/><text x="44" y="141" font-size="19" font-weight="700">1 · Trig</text><text x="44" y="169" font-size="16">Select a free slice.</text><text x="44" y="192" font-size="16">It becomes Master.</text><path d="M233 169 L259 169" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="270" y="112" width="200" height="118" rx="10" fill="#2b3542" stroke="#586476"/><text x="286" y="141" font-size="19" font-weight="700">2 · Add</text><text x="286" y="169" font-size="16">Use Slice + jog.</text><text x="286" y="192" font-size="16">Add two free slices.</text><path d="M475 169 L501 169" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="512" y="112" width="200" height="118" rx="10" fill="#2b3542" stroke="#586476"/><text x="528" y="141" font-size="19" font-weight="700">3 · Weight</text><text x="528" y="169" font-size="16">Adjust with the jog.</text><text x="528" y="192" font-size="16">Group stays at 100%.</text><path d="M717 169 L743 169" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="754" y="112" width="178" height="118" rx="10" fill="#2b3542" stroke="#586476"/><text x="770" y="141" font-size="19" font-weight="700">4 · Trig</text><text x="770" y="169" font-size="16">Leave group edit.</text><text x="770" y="192" font-size="16">Trigger the Master.</text><text x="28" y="283" font-size="17">Remove on a Member frees it. Remove on the Master deletes the whole group.</text><text x="28" y="322" font-size="13" fill="#9aa6b6">Tracker CE Modular · diagram, not a device screenshot</text></g></svg>