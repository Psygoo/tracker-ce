<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">One group, three variations</title><desc id="desc">Trigger the Master: one weighted choice. Trigger a Member: play that slice directly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a0aaba"/></marker></defs><rect width="960" height="340" rx="16" fill="#11151b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf1f6"><text x="28" y="38" font-size="24" font-weight="700">One group, three variations</text><text x="28" y="65" font-size="15" fill="#a7b1c0">Trigger the Master: one weighted choice. Trigger a Member: play that slice directly.</text><rect x="28" y="104" width="215" height="100" rx="10" fill="#2b3542" stroke="#586476"/><text x="44" y="133" font-size="19" font-weight="700">Master trigger</text><text x="44" y="161" font-size="16">Kick A / slice 1</text><path d="M248 153 L320 153" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="334" y="100" width="190" height="112" rx="10" fill="#692e3b" stroke="#586476"/><text x="350" y="129" font-size="19" font-weight="700">Kick A · Master</text><text x="350" y="157" font-size="16">60%</text><text x="350" y="180" font-size="16">Included in the draw</text><rect x="542" y="100" width="180" height="112" rx="10" fill="#6c4820" stroke="#586476"/><text x="558" y="129" font-size="19" font-weight="700">Kick B · Member</text><text x="558" y="157" font-size="16">30%</text><text x="558" y="180" font-size="16">Direct trigger works</text><rect x="740" y="100" width="192" height="112" rx="10" fill="#264f6b" stroke="#586476"/><text x="756" y="129" font-size="19" font-weight="700">Kick C · Member</text><text x="756" y="157" font-size="16">10%</text><text x="756" y="180" font-size="16">Direct trigger works</text><text x="334" y="257" font-size="18">All three share one group, in one instrument.</text><text x="334" y="284" font-size="17" fill="#bec8d6">Other groups and free slices remain independent.</text><text x="28" y="322" font-size="13" fill="#9aa6b6">Tracker CE — Weighted Random Slices &amp; SD Sample Editor · diagram, not a device screenshot</text></g></svg>