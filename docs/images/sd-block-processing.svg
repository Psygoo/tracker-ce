<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Long samples, bounded working memory</title><desc id="desc">The complete sample stays on the SD card; processing moves through fixed blocks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a0aaba"/></marker></defs><rect width="960" height="340" rx="16" fill="#11151b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf1f6"><text x="28" y="38" font-size="24" font-weight="700">Long samples, bounded working memory</text><text x="28" y="65" font-size="15" fill="#a7b1c0">The complete sample stays on the SD card; processing moves through fixed blocks.</text><rect x="28" y="110" width="190" height="104" rx="10" fill="#2b3542" stroke="#586476"/><text x="44" y="139" font-size="19" font-weight="700">Read</text><text x="44" y="167" font-size="16">Source PCM</text><text x="44" y="190" font-size="16">from SD</text><path d="M223 160 L254 160" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="266" y="110" width="200" height="104" rx="10" fill="#2b3542" stroke="#586476"/><text x="282" y="139" font-size="19" font-weight="700">1,024 frames</text><text x="282" y="167" font-size="16">Small PCM block</text><text x="282" y="190" font-size="16">Mono or stereo</text><path d="M471 160 L502 160" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="514" y="110" width="190" height="104" rx="10" fill="#2b3542" stroke="#586476"/><text x="530" y="139" font-size="19" font-weight="700">Native DSP</text><text x="530" y="167" font-size="16">Current parameters</text><text x="530" y="190" font-size="16">State between blocks</text><path d="M709 160 L740 160" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="752" y="110" width="180" height="104" rx="10" fill="#2b3542" stroke="#586476"/><text x="768" y="139" font-size="19" font-weight="700">Write</text><text x="768" y="167" font-size="16">Temporary file</text><text x="768" y="190" font-size="16">on SD</text><text x="28" y="262" font-size="18">Repeat → validate output → transactional commit → refresh Workspace and streaming caches</text><text x="28" y="291" font-size="17" fill="#bec8d6">Keep the prior sample for one-level Undo. External source files are not overwritten.</text><text x="28" y="322" font-size="13" fill="#9aa6b6">Tracker CE Modular · diagram, not a device screenshot</text></g></svg>