<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">One level of SD Undo</title><desc id="desc">Each successful Apply keeps the immediately preceding sample.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a0aaba"/></marker></defs><rect width="960" height="340" rx="16" fill="#11151b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf1f6"><text x="28" y="38" font-size="24" font-weight="700">One level of SD Undo</text><text x="28" y="65" font-size="15" fill="#a7b1c0">Each successful Apply keeps the immediately preceding sample.</text><rect x="28" y="110" width="180" height="100" rx="10" fill="#2b3542" stroke="#586476"/><text x="44" y="139" font-size="19" font-weight="700">Original A</text><text x="44" y="167" font-size="16">PCM + metadata</text><path d="M213 160 L256 160" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="268" y="110" width="180" height="100" rx="10" fill="#2b3542" stroke="#586476"/><text x="284" y="139" font-size="19" font-weight="700">Apply → B</text><text x="284" y="167" font-size="16">Undo can restore A</text><path d="M453 160 L496 160" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="508" y="110" width="180" height="100" rx="10" fill="#2b3542" stroke="#586476"/><text x="524" y="139" font-size="19" font-weight="700">Apply → C</text><text x="524" y="167" font-size="16">Undo can restore B</text><path d="M693 160 L736 160" stroke="#a0aaba" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="748" y="110" width="184" height="100" rx="10" fill="#2b3542" stroke="#586476"/><text x="764" y="139" font-size="19" font-weight="700">Undo → B</text><text x="764" y="167" font-size="16">No unlimited history</text><text x="28" y="262" font-size="18">Cancel before commit preserves the current sample and does not create a new Undo state.</text><text x="28" y="292" font-size="17" fill="#bec8d6">Use Undo in the same editor context. Recovery and Undo are different mechanisms.</text><text x="28" y="322" font-size="13" fill="#9aa6b6">Tracker CE Modular · diagram, not a device screenshot</text></g></svg>