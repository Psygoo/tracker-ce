<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Preview is an excerpt; Apply is the full selection</title><desc id="desc">Example: a selected region longer than ten seconds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a0aaba"/></marker></defs><rect width="960" height="350" rx="16" fill="#11151b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf1f6"><text x="28" y="38" font-size="24" font-weight="700">Preview is an excerpt; Apply is the full selection</text><text x="28" y="65" font-size="15" fill="#a7b1c0">Example: a selected region longer than ten seconds.</text><text x="28" y="125" font-size="18">Selected region</text><rect x="230" y="100" width="702" height="40" rx="6" fill="#39485c"/><text x="245" y="127" font-size="17">Start → full selected duration → End</text><text x="28" y="190" font-size="18">Preview</text><rect x="230" y="164" width="234" height="40" rx="6" fill="#ac3a4d"/><text x="245" y="191" font-size="17">First 10 seconds</text><text x="490" y="191" font-size="17" fill="#bec8d6">Private RAM copy; original stays intact</text><text x="28" y="255" font-size="18">Apply</text><rect x="230" y="228" width="702" height="40" rx="6" fill="#315d7b"/><text x="245" y="255" font-size="17">Entire selection, processed on SD</text><text x="230" y="296" font-size="16" fill="#bec8d6">Normalize scans the whole selection before calculating Preview gain.</text><text x="28" y="332" font-size="13" fill="#9aa6b6">Tracker CE — Weighted Random Slices &amp; SD Sample Editor · diagram, not a device screenshot</text></g></svg>